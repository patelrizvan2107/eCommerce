<style>
    #productDetail {
        margin-top: 130px;
        margin-bottom: 100px;
    }

    .productImg {
        overflow: hidden;
        border-radius: 10px;
    }

    .productImg img {
        width: 100%;
        object-fit: cover;
    }

    .productInfo h1 {
        font-size: 42px;
        margin-bottom: 15px;
    }

    .priceArea {
        margin: 20px 0;
    }

    .priceArea .oldPrice {
        text-decoration: line-through;
        color: gray;
        font-size: 20px;
    }

    .priceArea .newPrice {
        color: red;
        font-size: 32px;
        font-weight: 700;
        margin-left: 10px;
    }

    .rating {
        color: gold;
        font-size: 18px;
        margin-bottom: 20px;
    }

    .productInfo p {
        color: #666;
        line-height: 28px;
    }

    .colorBox {
        margin: 20px 0;
    }

    .sizeBtn {
        margin-top: 15px;
    }

    .sizeBtn button {
        border: 1px solid #ddd;
        background: white;
        padding: 10px 20px;
        margin-right: 10px;
    }

    .cartBtn {
        margin-top: 30px;
    }

    .cartBtn .btn-dark,
    .cartBtn .btn-danger {
        padding: 12px 30px;
        margin-right: 10px;
    }

    .relatedProduct img {
        width: 100%;
        object-fit: cover;
    }

    .relatedProduct {
        margin-top: 80px;
    }
    .colr {
        display: inline-block;
        padding: 10px 20px;
        margin-right: 0 10px;
    }

</style>
