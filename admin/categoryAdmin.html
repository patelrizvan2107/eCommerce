<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category | Admin Panel</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>Admin Panel</span>
            </div>

            <ul class="menu">
                <li class="active">
                    <a href="category.html">
                        <i class="fa-solid fa-list"></i>
                        Category
                    </a>
                </li>

                <li>
                    <a href="subCategory.html">
                        <i class="fa-solid fa-table-list"></i>
                        Subcategory
                    </a>
                </li>

                <li>
                    <a href="./product.html">
                        <i class="fa-solid fa-box"></i>
                        Product
                    </a>
                </li>
            </ul>

        </aside>

        <!-- Main -->
        <main class="main-content">

            <h1>Category Management</h1>

            <!-- Form Card -->
            <div class="card">

                <form class="category-form">

                    <div class="form-row">

                        <div class="form-group">
                            <label>Category Name</label>
                            <input type="text" id="category-name">
                            <span class="nameError"></span>

                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="category-desc" rows="4"></textarea>
                            <span class="descError"></span>

                        </div>

                    </div>


                    <div class="image-row">

                        <div class="form-group image-upload">
                            <label>Upload Image</label>
                            <input type="file" id="category-image">
                            <span id="imageError"></span>
                        </div>

                        <div class="form-group image-preview">
                            <label>Preview</label>
                            <img src="" id="etdimg" class="preview-image">
                        </div>

                    </div>

                    <button class="btn" type="submit">
                        Submit
                    </button>

                </form>

            </div>

            <!-- Table Card -->

            <div class="card">

                <h2>Category List</h2>

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Image</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="tableContent">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="js/categoryAdmin.js"></script>

</body>

</html>
