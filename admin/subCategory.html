<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcategory | Admin Panel</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>Admin Panel</span>
            </div>

            <ul class="menu">

                <li>
                    <a href="./categoryAdmin.html">
                        <i class="fa-solid fa-list"></i>
                        Category
                    </a>
                </li>

                <li class="active">
                    <a href="subCategory.html">
                        <i class="fa-solid fa-table-list"></i>
                        Subcategory
                    </a>
                </li>

                <li>
                    <a href="product.html">
                        <i class="fa-solid fa-box"></i>
                        Product
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <h1>Subcategory Management</h1>

            <!-- Form Card -->

            <div class="card">

                <form id="subForm" class="category-form">

    <div class="form-row">

        <div class="form-group">
            <label>Category</label>

            <select id="subData">
                <option value="">Select Category</option>
            </select>
        </div>

        <div class="form-group">
            <label>Subcategory Name</label>
            <input type="text" id="category-name">
            <span id = "nameError"></span>

        </div>

    </div>

    <div class="form-row">

        <div class="form-group">
            <label>Description</label>
            <textarea id="category-desc" rows="4"></textarea>
            <span id = "descError"></span>

        </div>

        <div class="form-group">

            

            
        </div>

    </div>

    <div class="image-row">

        <div class="form-group image-upload">
            <label>Upload Image</label>
            <input type="file" id="category-image">
            <span id = "imageError"></span>

        </div>

        <div class="form-group image-preview">
            <label>Preview</label>
            <img src="" id="updateImage" class="preview-image">
        </div>

    </div>

    <button type="submit" class="btn">
        Submit
    </button>

</form>
            </div>

            <!-- Table Card -->

            <div class="card">

                <h2>Subcategory List</h2>

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>

                            <th>Category</th>

                            <th>Subcategory</th>

                            <th>Description</th>

                            <th>Image</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="subDataDisp">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="./js/subCategory.js"></script>

</body>

</html>
