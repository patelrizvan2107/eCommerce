<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Admin Panel</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-layer-group"></i>
            <span>Admin Panel</span>
        </div>

        <ul class="menu">

            <li>
                <a href="categoryAdmin.html">
                    <i class="fa-solid fa-list"></i>
                    Category
                </a>
            </li>

            <li>
                <a href="subCategory.html">
                    <i class="fa-solid fa-table-list"></i>
                    Subcategory
                </a>
            </li>

            <li class="active">
                <a href="product.html">
                    <i class="fa-solid fa-box"></i>
                    Product
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <h1>Product Management</h1>

        <!-- Product Form -->
        <div class="card">

            <form id="productForm" class="category-form">

                <div class="form-group">
                    <label>Category</label>
                    <select id="categorySelect">
                    </select>
                </div>

                <span id="categoryError"></span>

                <div class="form-group">
                    <label>Subcategory</label>
                    <select id="subcategorySelect">
                    </select>
                </div>

                <span id="subcategoryError"></span>

                <div class="form-group">
                    <label>Product Name</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter Product Name">
                </div>

                <span id="nameError"></span>

                <div class="form-group">
                    <label>Description</label>
                    <textarea
                        id="productDesc"
                        rows="4"
                        placeholder="Enter Product Description"></textarea>
                </div>

                <span id="descError"></span>

                <div class="form-group">
                    <label>Upload Product Image</label>
                    <input
                        type="file"
                        id="productImage"
                        accept="image/*">

                        <span id="imageError"></span>
                </div>

                    <div class="form-group">

                        <label>Preview</label>

                        <img
                            src=""
                            id="updateImage"
                            alt="Preview"
                            class="preview-image">

                    </div>

                <button type="submit" class="btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    Save Product
                </button>

            </form>

        </div>

        <!-- Product Table -->
        <div class="card">

            <h2>Product List</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Category</th>
                        <th>Subcategory</th>
                        <th>Product Name</th>
                        <th>Description</th>
                        <th>Image</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="productTable">

                    <!-- Dynamic Data -->

                    <!-- Example Row -->
                    <!--
                    <tr>
                        <td>1</td>
                        <td>Electronics</td>
                        <td>Mobiles</td>
                        <td>iPhone 15</td>
                        <td>Latest Apple smartphone</td>
                        <td>
                            <img src="images/demo.jpg" width="70">
                        </td>
                        <td>
                            <button class="edit-btn">
                                <i class="fa-solid fa-pen"></i>
                            </button>

                            <button class="delete-btn">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    -->

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="js/product.js"></script>

</body>
</html>
