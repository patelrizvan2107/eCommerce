<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Admin Panel</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>Admin Panel</span>
            </div>

            <ul class="menu">

                <li>
                    <a href="categoryAdmin.html">
                        <i class="fa-solid fa-list"></i>
                        Category
                    </a>
                </li>

                <li>
                    <a href="subCategory.html">
                        <i class="fa-solid fa-table-list"></i>
                        Subcategory
                    </a>
                </li>

                <li class="active">
                    <a href="product.html">
                        <i class="fa-solid fa-box"></i>
                        Product
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <h1>Product Management</h1>

            <!-- Product Form -->
            <div class="card">

                <form id="productForm" class="category-form">

                    <div class="form-row">

                        <div class="form-group">
                            <label>Category</label>
                            <select id="categorySelect"></select>
                            <span id="categoryError"></span>



                        </div>

                        <div class="form-group">
                            <label>Subcategory</label>
                            <select id="subcategorySelect"></select>
                            <span id="subcategoryError"></span>
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" id="productName">
                            <span id="nameError"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Price ($)</label>
                                <input type="number" id="productPrice" min="0" step="0.01">
                                <span id="priceError"></span>
                            </div>

                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="productDesc" rows="4"></textarea>
                            <span id="descError"></span>
                        </div>

                    </div>

                    <div class="checkbox-group">

                        <label><input type="checkbox" id="new" name="tags"> New</label>

                        <label><input type="checkbox" id="bestseller" name="tags"> Bestseller</label>

                        <label><input type="checkbox" id="summer" name="tags"> Summer</label>

                        <label><input type="checkbox" id="winter" name="tags"> Winter</label>

                        <label><input type="checkbox" id="monsoon" name="tags"> Monsoon</label>

                    </div>

                    <div class="image-row" id="allImage">

                        <div class="form-group image-upload">
                            <label>Upload Product Image</label>
                            <div>
                                <input type="file" id="productImage" name="inputImage">
                                <label>Add More Images</label>
                                <button type="button" onclick="hanldeMulImage()">Add</button>
                            </div>
                            <span id="imageError"></span>
                        </div>

                        <div class="form-group image-preview">
                            <label>Preview</label>
                            <img src="" id="updateImage" name="updateImage" class="preview-image">
                        </div>

                    </div>



                    <button type="submit" class="btn">
                        Save Product
                    </button>

                </form>
            </div>

            <!-- Product Table -->
            <div class="card">

                <h2>Product List</h2>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Category</th>
                            <th>Subcategory</th>
                            <th>Product Name</th>
                            <th>Price</th> <!-- NEW -->
                            <th>Description</th>
                            <th>Image</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="productTable">


                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="js/product.js"></script>

</body>

</html>
